set default=0
set timeout=3
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

# 默认项: ttyS0 先注册、tty0 收尾 => 交互控制台落在图形控制台(VMware 窗口可见可输入)
menuentry 'Install AIKernel 0.1.0-alpha' {
	linux /boot/bzImage console=ttyS0 console=tty0
	initrd /boot/initrd.img
}

# 第二项: 旧顺序(tty0 先、ttyS0 收尾) => 交互落在串口, 供 -nographic/串口用户
menuentry 'Install AIKernel 0.1.0-alpha (serial console)' {
	linux /boot/bzImage console=tty0 console=ttyS0
	initrd /boot/initrd.img
}
