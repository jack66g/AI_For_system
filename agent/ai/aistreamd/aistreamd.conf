# aistreamd.conf - K3c 常驻事件流守护配置（KEY=VALUE，风格对齐 aikd.conf）
#
# 坏值/未知键 = 启动拒绝（exit 1，journal 给出行号与原因）。
# 修改后 systemctl restart aikernel-streams 生效。

# ---- SME 写入 ----
# SME REST 基地址（POST /memories）
SME_URL=http://127.0.0.1:8000
# 记忆重要度（0<x<=1；低档防洪泛）
IMPORTANCE=0.3
# SME 不可达后环形缓冲补写重试间隔（秒）
SME_RETRY_SEC=5

# ---- 配额（lease：防记忆洪泛） ----
# 全局速率：滑动 60s 窗口写入上限（条/分钟）
RATE_PER_MIN=60
# 全局日上限（条/日，本地日界）
DAILY_MAX=5000
# 每路日上限（条/日）
STREAM_DAILY_MAX=1000
# 同类事件去重窗口（毫秒；窗口内同 digest 只计数，窗口结束聚合补写）
DEDUP_WINDOW_MS=10000

# ---- 降级环形缓冲 ----
# SME 不可达时暂存上限（条）；满则丢旧不丢新（计数+journal 限频告警）
RING_SIZE=4096

# ---- 每路开关（1=订阅 0=关闭） ----
ENABLE_EVENT=1
ENABLE_PROC=1
ENABLE_NET=1
ENABLE_UEVENT=1
ENABLE_NFLOG=1
ENABLE_TASKSTATS=1

# ---- taskstats 周期采样 ----
TASKSTATS_INTERVAL_SEC=30
TASKSTATS_MAX_PIDS=256

# ---- NETLINK_AI 测试通道（仅测试！生产必须 0） ----
# 0 = 真 NETLINK_AI(31) REG→EVENT（需 AIKernel 内核 + CAP_SYS_ADMIN）
# 2 = NETLINK_USERSOCK(2) mock 通道（跳过 REG；注入器经 stats 文件的
#     nl_ai_portid 定位单播）；仅单测/e2e/A-B 使用，journal 会明示 MOCK
AI_MOCK_PROTO=0

# ---- K3d-2 热插拔建议流水线（I-9 MVP：只建议，绝不自动执行！） ----
# ██████ C7 红线：设备移除/下线类动作**永不自动执行**；advisory 的
# executed 字段恒为 false（代码硬编码）。任何未来自动化需单独立项过
# I 轨登记。█████████████████████████████████████████████████
# 总开关（默认 0=关——出厂默认是否打开由收口轮拍板）
HOTPLUG_ENABLED=0
# 推理模型名（写 /sys/kernel/ai/model_infer "name hex..."，K3b 核对契约）。
# 留空=未配置 → advisory 的 infer.status=skipped_unconfigured，流水线其余
# 照走（事件照记建议）
HOTPLUG_MODEL=
# advisory 落盘日限（默认 200；复用既有配额器，独立实例）
HOTPLUG_DAILY_MAX=200
# 特征向量维度（float32 小端 hex；f[0]=类型码/10，f[i>=1]=payload_digest
# 字节映射——公式冻结见 as_hotplug.c hp_features）
HOTPLUG_INFER_DIM=8
# 无 /sys/kernel/ai/model_infer（L1 等无 AIKernel 内核面）时：
# 1 = 确定性 mock 前向（journal 明示 TEST ONLY——仅测试！）
# 0 = 诚实 skipped_noiface
HOTPLUG_INFER_MOCK=0
# advisory JSONL 落盘路径（0600；父目录不存在则创建 0700）
HOTPLUG_LOG=/var/log/aikernel/hotplug-advisories.jsonl

# ---- 可观测 ----
# stats 文件周期写间隔（秒）；SIGUSR1 立即写；退出前终笔
STATS_INTERVAL_SEC=10
# 1=debug 日志（taskstats 轮次等）
LOG_DEBUG=0

# ---- 运行时路径 ----
STATS_FILE=/run/aistreamd.stats
PID_FILE=/run/aistreamd.pid
LOCK_FILE=/run/aistreamd.lock

# ---- T8：Parquet 落盘链（aikd_lib.py C 化；schema/布局对齐 REF） ----
# 事件→行映射（telemetry schema）：timestamp_ns=墙钟ms-btime 换算单调ns、
# pid=事件主体（proc 类）、tgid/cpu=0、category=流→ai_category 映射
# （event→ai/proc→process/net→net/uevent→hw/nflog→security/
# taskstats→sched）、event_type=0（0=非内核事件类型，aistreamd 行专用）、
# severity=info0/warn1/error2、data=规范化行全文（零脱敏）。
# 布局：telemetry/YYYY-MM-DD/<cat>_NNNN.parquet + index.parquet、
# decisions/YYYY-MM-DD/decisions.parquet、decisions/<日>/chains_<日>.parquet
# （日期边界 UTC，同 REF）。pyarrow 直接可读（AI 训练数据契约保留）。
# 总开关（默认 0=关——出厂默认开留收口轮 ISO 拍板；关=零文件零目录）
PARQUET_ENABLED=0
# 数据根（默认 /var/lib/aikernel，同 REF DEFAULT_ROOT；绝对路径）
PARQUET_DIR=/var/lib/aikernel
# 保留上限 GB（超限删最老 UTC 天目录——当天永不删；删前 journal 逐文件
# 列名；只删布局内文件，目录含异物则整目录跳过）
PARQUET_MAX_GB=2
# 批写节流：到时或行数满即 flush（每次 flush=每类每批一个新文件+序号旋转）
PARQUET_FLUSH_SEC=30
PARQUET_FLUSH_ROWS=128

# ---- I-10：决策闭环第 4 步 outcome 回填器（as_outcome.c；C3 默认关） ----
# 写 /sys/kernel/ai/policy/outcome "<decision_id>,<outcome>,<metric_delta>"
# ——内核纯注记（不改行为、不进 hitrate 分母）；EVENT policy 事件驱动，
# 窗口到期读 §3 指标表源（/proc/pressure、/proc/vmstat、/proc/net/netstat、
# /sys/kernel/ai/stats/* 等）算 delta 分类后回填。metric 表与单位文档见
# as_outcome.c 表头注释（设计 I10-METRIC-DESIGN.md §3/§4）。
# 总开关（默认 0=关——出厂默认 off，验收演示通过后再谈默认开，§6.4）
OUTCOME_ENABLED=0
# S 类窗口（秒；任务级/确定性/读回类旋钮）
OUTCOME_WINDOW_SHORT_SEC=30
# L 类窗口（秒；全局/统计类旋钮——稳态需沉淀）
OUTCOME_WINDOW_LONG_SEC=300
# 窗口后宽容（秒；读口确认用——外部验收脚本复核口径，模块自校验即时）
OUTCOME_GRACE_SEC=10
# pending 队容量（满丢旧+计数；洪泛截流）
OUTCOME_MAX_PENDING=256
# /proc/ai/decisions 尾条反查最大行数（全量读 ~557KB 成本截断，K1B-20）
OUTCOME_DECISIONS_SCAN_MAX=64
# 回填结果合成事件走既有 SME/parquet 管道（SME 不可达不阻塞 outcome 写）
OUTCOME_WRITE_SME=1
# C4：WORSE 自动 policy/rollback ——恒默认 0；且写路径本轮不实现（需单独
# 拍板，置 1 仅 journal 提示，不执行任何回滚）
OUTCOME_AUTO_ROLLBACK=0
# TEST ONLY：mock 树前缀（L1 无 AIKernel 内核的冒烟/单测用；生产恒 "/"）
OUTCOME_MOCK_ROOT=/

# ---- SENSE 遥测脱敏（产生侧；多用户前提——设计 SENSE-REDACT-DESIGN.md） ----
# 出厂默认 off=单用户现状零字节变化（T8 parquet「data 零脱敏」契约与
# 冻结 fixture 保持）；多用户形态落地时建议翻 soft（多租户/不可信消费方
# 用 strict）——翻档时点由主会话拍板。
# off    恒等透传（零开销）
# soft   身份/内容字段 hash/mask（comm/uid=hash，IP/路径/模型名=mask，
#        telemetry 类截断）——保聚合与时序语义
# strict 强档：身份/内容字段 drop（pid 仍 hash 保对账）；仅系统语义字段过
# decision_id 恒原样（K3-DESIGN §K3c 审计链例外，不可配）
SENSE_REDACT=off
# hash 盐（默认空=确定性格式，跨重启可 join；≤64 字节非空白；配盐后
# 低熵值（pid）的枚举反查被阻断——匿名强度提升，代价是跨重启不可关联）
SENSE_REDACT_SALT=
