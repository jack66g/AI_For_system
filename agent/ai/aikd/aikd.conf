# aikd.conf - AI Kernel Daemon 配置（B 轨，数据计划 P7）
#
# 键值格式：KEY=VALUE（# 开头为注释）。修改后重启 aikd 生效。

# 数据根目录（数据计划 23.3 离线存储布局）
ROOT=/var/lib/aikernel

# 守护模式轮询周期（秒）：每次从 NETLINK_AI 拉取全部 CPU 遥测
POLL_SEC=5

# RAG 索引增量更新脚本（为空 = 不触发；指向 AIKernel/rag/build_index.py）
# RAG_SCRIPT=/home/jack66g/AIKernel/linux-6.18.39/AIKernel/rag/build_index.py
RAG_SCRIPT=
