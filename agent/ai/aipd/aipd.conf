# aipd.conf - AIPD-M1 影子守护配置（KEY=VALUE，风格对齐 aistreamd.conf）
#
# 坏值/未知键 = 启动拒绝（exit 1，journal 给出行号与原因）。
# 修改后 systemctl restart aikernel-aipd 生效（影子期手动起——未过
# 金丝雀不自动上线，M2 拍板；设计 AIPD-M1-DESIGN §2.2）。
#
# ██████ M1 红线：SHADOW 恒 1——aipd 无任何 ACT 下发代码路径，全部
# 输出=本地影子记录+stats。█████████████████████████████████████

# ---- 特征输入 ----
# 主路=AI_FEATURES map(35 号) 轮询（裸 bpf()，无 libbpf）；mock=jsonl
# 供测试/无 map 宿主（字段镜像 ai_feature_vec 48B 冻结契约）
FEAT_SOURCE=map35
# mock jsonl 路径（FEAT_SOURCE=mock 或 FEAT_DEGRADE_MOCK=1 时必填）
#FEAT_MOCK_FILE=/var/lib/aikernel/aipd/mock_features.jsonl
# map35 不可用（EPERM/ENOSYS/非 AI 内核）时：0=诚实启动失败 exit 1
# （默认）；1=降级 mock+计数（journal 明示 DEGRADED）
FEAT_DEGRADE_MOCK=0
# 特征轮询频率（Hz；默认 10。新鲜度阈值=3×max(内核 1s, 1/POLL_HZ)）
POLL_HZ=10

# ---- 模型表 ----
# M1 内置静态阈值表（aip_table.c；sha256 加载自校验）。唯一值 builtin；
# Lane-B 生成器产物同编替换（--check 漂移拒）
MODEL_TABLE=builtin

# ---- 影子（M1 冻结恒 1——置 0 拒绝启动） ----
SHADOW=1
# 影子 parquet 根（布局 <dir>/aipd/<UTC日>/shadow_NNNN.parquet；
# 33 列=decisions v3 32 列同构+source 尾列 "aipd_shadow"）
PARQUET_DIR=/var/lib/aikernel
# 影子批写节流（秒/行，先到先 flush）
SHADOW_FLUSH_SEC=10
SHADOW_FLUSH_ROWS=128

# ---- 对照流（只读；as_decisions 摄取游标手法；默认关） ----
# 消费 NETLINK_AI 决策落盘面 /proc/ai/decisions（decision_id 游标），
# 与影子最新决策比对 → 滚动窗 mismatch_pct（stats 面）。不计入
# aistreamd 消费面。无内核面=ENOENT 诚实计数。
COMPARE_ENABLED=0
# proc=真内核面；mock=jsonl 文件（{"decision_id":N,"action":A}——
# TEST ONLY，Lane-B m1_bench 双流断言用）
COMPARE_SOURCE=proc
#COMPARE_MOCK_FILE=/var/lib/aikernel/aipd/mock_compare.jsonl
COMPARE_INTERVAL_SEC=5
# mismatch 滚动窗容量（条）
CMP_WINDOW=256

# ---- 可观测 ----
# stats 周期写（/run/aipd.stats 原子写；SIGUSR1 即写；heartbeat_ts_ms
# =失联判据：N 秒不更新=失联不发 ACT——M1 无 ACT 路径，为 M2 预置面）
STATS_INTERVAL_SEC=10
LOG_DEBUG=0

# ---- 运行时路径（测试隔离可改临时目录） ----
STATS_FILE=/run/aipd.stats
PID_FILE=/run/aipd.pid
LOCK_FILE=/run/aipd.lock
