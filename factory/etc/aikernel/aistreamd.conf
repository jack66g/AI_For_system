# aistreamd.conf - AIKernel 常驻事件流守护出厂配置（K3c）
# 部署位置 /etc/aikernel/aistreamd.conf（unit: aikernel-streams.service）
# 键说明见仓库 agent/ai/aistreamd/aistreamd.conf（带注释全量样例）。
# 坏值/未知键 = 启动拒绝（journal 给出行号与原因）。

SME_URL=http://127.0.0.1:8000
IMPORTANCE=0.3
SME_RETRY_SEC=5

RATE_PER_MIN=60
DAILY_MAX=5000
STREAM_DAILY_MAX=1000
DEDUP_WINDOW_MS=10000

RING_SIZE=4096

ENABLE_EVENT=1
ENABLE_PROC=1
ENABLE_NET=1
ENABLE_UEVENT=1
ENABLE_NFLOG=1
ENABLE_TASKSTATS=1

TASKSTATS_INTERVAL_SEC=30
TASKSTATS_MAX_PIDS=256

# 生产环境必须 0（真 NETLINK_AI）；2 仅测试 mock 通道
AI_MOCK_PROTO=0

STATS_INTERVAL_SEC=10
LOG_DEBUG=0

STATS_FILE=/run/aistreamd.stats
PID_FILE=/run/aistreamd.pid
LOCK_FILE=/run/aistreamd.lock

# ---- K3d-2 hotplug advisory pipeline (I-9 MVP: suggest-only, NEVER execute) ----
# C7 RED LINE: device removal/offline actions are NEVER auto-executed;
# advisory "executed" field is always false (hardcoded). Any future
# automation needs its own I-track entry. See agent/ai/aistreamd/aistreamd.conf
# for full commented keys (HOTPLUG_MODEL/HOTPLUG_INFER_DIM/HOTPLUG_INFER_MOCK).
HOTPLUG_ENABLED=1
HOTPLUG_DAILY_MAX=200
HOTPLUG_LOG=/var/log/aikernel/hotplug-advisories.jsonl

# ---- T8 parquet telemetry persistence (aikd_lib.py ported to C) ----
# Schema/layout parity with REF (pyarrow-readable). Factory default ON since
# alpha.15.3 (W-153 closeout decision; data dir /var/lib/aikernel pre-created
# in the factory rootfs, sink also self-creates it). Keys documented in
# agent/ai/aistreamd/aistreamd.conf.
PARQUET_ENABLED=1
PARQUET_DIR=/var/lib/aikernel
PARQUET_MAX_GB=2
PARQUET_FLUSH_SEC=30
PARQUET_FLUSH_ROWS=128

# ---- I-10 outcome backfill (as_outcome, C3 advisory-only) ----
# Factory default OFF (I10IMPL-REPORT; ruling 2026-11-09: stays off until
# the I10-METRIC-DESIGN section-5 gates pass on the factory kernel).
OUTCOME_ENABLED=0
# ---- SENSE telemetry redaction (two-layer, five-policy, three-state) ----
# Factory default off (SENSE-REDACT-REPORT: single-user form, zero byte
# change; flip to soft when the multi-user form lands).
SENSE_REDACT=off
# ---- T8 decisions source (as_decisions, UE wiring) ----
# Factory default OFF (main-session ruling 2026-11-09).
DECISIONS_ENABLED=0
