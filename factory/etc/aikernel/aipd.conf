# aipd.conf - AIKernel AI 决策影子守护出厂配置（M1；AIPD-M1-DESIGN §1.1）
# 部署位置 /etc/aikernel/aipd.conf（unit: aikernel-aipd.service——出厂
# install 但【不 enable】，影子期手动起，M2 金丝雀后拍板自启）。
# 键说明见仓库 agent/ai/aipd/aipd.conf（带注释全量样例）。
# 坏值/未知键 = 启动拒绝 exit 1（journal 给出行号与原因）。

# ---- 特征输入（§1.2） ----
# 主路=AI_FEATURES map(35 号) 轮询（裸 bpf() syscall，k7feat 手法，不引
# libbpf）；mock=读 FEAT_MOCK_FILE jsonl（字段=ai_feature_vec 镜像，
# 测试/无 map 宿主用）。出厂主路=map35。
FEAT_SOURCE=map35
FEAT_MOCK_FILE=
POLL_HZ=10

# ---- 模型表（§1.3） ----
# builtin=编译进 aip_table.c（gen_aip_table.py 产物，含 AIP_TABLE_VER/
# 摘要自校验常量；加载时重算比对，篡改拒载）。M1 无外部表路径。
MODEL_TABLE=builtin

# ---- 影子语义（§0/§1.4） ----
# M1 恒 1：只产影子记录（shadow parquet）+对照内核 decision_id 流算
# 不一致率（mismatch_pct 进 stats），绝无 ACT 下发。金丝雀/真下发=M2。
SHADOW=1
# 影子 parquet 根：<root>/<UTC 日>/shadow_NNNN.parquet（decisions 32 列
# v3 同构+尾列 source="aipd_shadow"；随 aistreamd PARQUET_DIR 同根惯例）。
SHADOW_DIR=/var/lib/aikernel/aipd
# 对照源=NETLINK_AI EVENT decision_id 流（as_decisions 摄取游标手法）。
DECISIONS_SOURCE=netlink_ai

# ---- 心跳/统计（§1.1；降级链=M1 唯一新增语义） ----
# stats N 秒不更新=失联→（下游）不发 ACT。周期写 /run/aipd.stats（原子
# 写：周期+USR1+退出前）。
STATS_INTERVAL_SEC=10

# ---- 运行时文件（aistreamd 同款三件） ----
STATS_FILE=/run/aipd.stats
PID_FILE=/run/aipd.pid
LOCK_FILE=/run/aipd.lock
