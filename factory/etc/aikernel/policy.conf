# AIKernel 用户权限分级策略（P2, 2026-09-28）
# mode: privileged / confirmed / restricted
[root]
mode = privileged        # root: W1 自动；W2 二次确认
[wheel]
mode = confirmed         # sudo 组: W1 自动；W2 拒绝并提示 sudo
group = sudo             # Ubuntu 22.04 sudo 组（GID 27）
[default]
mode = restricted        # 其他用户: W1 白名单内自动；W2 拒绝
#
# per-user 档位覆盖段（可选，P2 Phase B）：[user:<用户名>] 优先级最高，
# 段内 mode 取上述三值（小写）；对 root 恒不生效（root 恒按 [root] 段，
# 任何 [user:*] 不能把 root 降档）。段内未知键忽略；未知用户名段永不
# 命中。出厂不含生效的 per-user 段——需要时去掉下两行注释并改用户名：
#[user:alice]
#mode = confirmed        # 例：alice 单独定档 confirmed
