#!/usr/sbin/nft -f
# AIKernel 出厂防火墙基线（W10-A, 2026-10-01）
# input：仅放行 loopback / 已建立连接 / ICMP / SSH(22)，其余 drop
# forward：拒绝；output：不限
# 服务暴露面：ollama(11434)/SME(8000) 仅绑 127.0.0.1，不经防火墙对外暴露
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iifname "lo" accept comment "loopback"
        ct state established,related accept comment "已建立连接及关联"
        meta l4proto icmp accept comment "IPv4 ICMP"
        meta l4proto icmpv6 accept comment "IPv6 ND/ICMPv6"
        tcp dport 22 accept comment "SSH 远程管理"
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
