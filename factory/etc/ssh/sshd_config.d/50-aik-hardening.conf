# AIKernel SSH 出厂硬化（C-P1a / W83 决策落地，2026-11-17）
# 本件即 aik-backup（W28_EXTRAS）与 aik-upgrade（EXPORT_LIST）的引用
# 目标——此前为幽灵引用（引用而文件不存在），本件落真。
# 立场：控制台 gate/TUI=主交互面；SSH=密钥制运维通道（root 仅密钥）。
# 首启接管通道：17.8 起 build 侧可选 PROV_PUBKEY 注入 root
# authorized_keys（见 TASK-BOOK v3 §3.3 演示机流程）。
# 修改本件须同步：aik-backup W28_EXTRAS + aik-upgrade EXPORT_LIST。
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
MaxAuthTries 4
LoginGraceTime 30
MaxStartups 6:30:60
X11Forwarding no
