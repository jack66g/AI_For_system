<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- P-34: 精简出厂未带 fontconfig 主配置，fbterm 内 fontconfig 初始化报
     "Cannot load default config file"，CJK 渲染降级（半字）。
     本文件为最小骨架：字体目录 + 缓存目录 + 通用族别名统一指向
     Noto Sans Mono CJK SC（NotoSansMonoCJKsc-Regular.otf 内部族名）。 -->
<fontconfig>
  <!-- 字体目录 -->
  <dir>/usr/local/share/aikernel/fonts</dir>
  <dir>/usr/share/fonts</dir>

  <!-- 字体缓存目录 -->
  <cachedir>/var/cache/fontconfig</cachedir>

  <!-- 通用族别名：衬线/无衬线/等宽统一落到 Noto Sans Mono CJK SC -->
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
